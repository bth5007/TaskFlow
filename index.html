<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 할 일</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .date {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        #addButton {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #addButton:hover {
            background: #3730a3;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .task span {
            flex: 1;
            font-size: 16px;
        }

        .completed span {
            text-decoration: line-through;
            color: #999;
        }

        .delete-button {
            border: none;
            background: #ef4444;
            color: white;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #dc2626;
        }

        .progress {
            margin-top: 25px;
            text-align: center;
            color: #555;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 오늘의 할 일</h1>

        <div class="date" id="today"></div>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="할 일을 입력하세요"
            >
            <button id="addButton">추가</button>
        </div>

        <ul id="taskList"></ul>

        <div class="progress" id="progress">
            완료한 할 일: 0 / 0
        </div>

    </div>

    <script>

        const taskInput = document.getElementById("taskInput");
        const addButton = document.getElementById("addButton");
        const taskList = document.getElementById("taskList");
        const progress = document.getElementById("progress");
        const today = document.getElementById("today");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        // 오늘 날짜 표시
        const now = new Date();

        today.textContent =
            now.getFullYear() + "년 " +
            (now.getMonth() + 1) + "월 " +
            now.getDate() + "일";

        // 할 일 저장
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // 화면에 할 일 표시
        function renderTasks() {

            taskList.innerHTML = "";

            if (tasks.length === 0) {
                taskList.innerHTML =
                    '<li class="empty">아직 등록된 할 일이 없습니다.</li>';
            }

            tasks.forEach((task, index) => {

                const li = document.createElement("li");

                li.className = "task";

                if (task.completed) {
                    li.classList.add("completed");
                }

                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                checkbox.addEventListener("change", () => {
                    tasks[index].completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const span = document.createElement("span");

                span.textContent = task.text;

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent = "삭제";
                deleteButton.className = "delete-button";

                deleteButton.addEventListener("click", () => {

                    tasks.splice(index, 1);

                    saveTasks();
                    renderTasks();
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteButton);

                taskList.appendChild(li);
            });

            updateProgress();
        }

        // 할 일 추가
        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {
                alert("할 일을 입력해주세요!");
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            taskInput.value = "";

            saveTasks();
            renderTasks();

            taskInput.focus();
        }

        // 완료 개수 표시
        function updateProgress() {

            const completedTasks =
                tasks.filter(task => task.completed).length;

            progress.textContent =
                `완료한 할 일: ${completedTasks} / ${tasks.length}`;
        }

        // 추가 버튼
        addButton.addEventListener("click", addTask);

        // Enter 키로 추가
        taskInput.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                addTask();
            }

        });

        // 처음 화면 표시
        renderTasks();

    </script>

</body>
</html>
